<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Аналіз мови</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f4f4;
    }

    h1 {
      color: #d32f2f;
      font-size: 36px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .btn {
      background: #1976d2;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .label {
      color: #666;
      font-size: 14px;
    }

    .value {
      font-size: 18px;
      font-weight: bold;
    }

    .progress {
      height: 18px;
      border-radius: 10px;
      background: #e0e0e0;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress > div {
      height: 100%;
      background: #4caf50;
      width: 0%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Аналіз мови</h1>

  <div class="card">
    <button id="startBtn" class="btn">Записати 5 сек</button>
    <div id="status" class="status"></div>
  </div>

  <div id="resultCard" class="card" style="display:none;">
    <div class="grid">
      <div>
        <div class="label">Оцінка якості мови</div>
        <div class="value" id="score">0/10</div>
        <div class="progress">
          <div id="scoreBar"></div>
        </div>
      </div>
      <div>
        <div class="label">Темп мовлення</div>
        <div class="value" id="wpm">0 слів/хв</div>

        <div class="label" style="margin-top: 12px;">Слів-паразитів</div>
        <div class="value" id="parasites">0</div>
      </div>
    </div>

    <hr>

    <div class="label">Розпізнаний текст (початок)</div>
    <pre id="recognized"></pre>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
