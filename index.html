<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Fiducia - Аналіз мови</title>
  <link rel="stylesheet" href"static/style.css">
</head>
<body>
  <h1>Аналіз мови</h1>

  <div class="card">
    <button id="startBtn" class="btn">Записати 5 сек</button>
    <div id="status" class="status"></div>
  </div>

  <div id="resultCard" class="card" style="display:none;">
    <div class="grid">
      <div>
        <div class="label">Оцінка якості мови</div>
        <div class="value" id="score">0/10</div>
        <div class="progress">
          <div id="scoreBar"></div>
        </div>
      </div>

      <div>
        <div class="label">Темп мовлення</div>
        <div class="value" id="wpm">0 слів/хв</div>

        <div class="label" style="margin-top:12px;">Слів-паразитів</div>
        <div class="value" id="parasites">0</div>
      </div>
    </div>

    <hr>

    <div class="label">Аналізований текст</div>
    <pre id="recognized">Текст ще не аналізовано...</pre>
  </div>

  <hr>

  <div class="upload-section card">
    <h2>Завантажити аудіофайл</h2>
    <form id="uploadForm">
      <input type="file" id="fileInput" accept=".webm,.wav,.mp3,.m4a" required />
      <button type="submit" class="btn">Проаналізувати файл</button>
    </form>
    <div id="fileStatus" class="status"></div>
  </div>

  <div class="text-section card">
    <h2>Аналіз готового тексту</h2>
    <form id="textForm">
      <textarea
        id="textInput"
        placeholder="Вставте або введіть текст для аналізу..."
        rows="6"
        required
      ></textarea>
      <div class="char-counter">
        <span id="charCount">0</span> символів
      </div>
      <button type="submit" class="btn">Проаналізувати текст</button>
    </form>
    <div id="textStatus" class="status"></div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
